<section class="page">
  <a *ngIf="!isSharedClaimsFormRoute" class="back-link" routerLink="/claimant/dashboard">Back to dashboard</a>
  <h1>Submit a claim</h1>
  <p class="intro">Complete the form to submit your claim.</p>

  <app-loading [active]="loading" label="Submitting claim"></app-loading>
  <app-error-message [message]="errorMessage"></app-error-message>

  <div *ngIf="submission as result" class="alert alert-success" role="status">
    Claim submitted. Your reference is <strong>{{ result.claimReference }}</strong>.
    <a *ngIf="!isSharedClaimsFormRoute" [routerLink]="['/claimant/claims', result.claimReference]">View claim</a>
  </div>

  <app-dynamic-form-renderer
    *ngIf="!submission"
    [schema]="formSchema"
    [previewOnly]="false"
    [submitDisabled]="loading"
    (validSubmit)="submit($event)">
  </app-dynamic-form-renderer>
</section>

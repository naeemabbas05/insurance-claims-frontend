<section class="page">
  <p class="eyebrow">Claimant workspace</p>
  <h1>Your claims</h1>
  <p class="intro">Submit a claim or follow up using your claim reference.</p>
  <div class="actions">
    <a class="btn btn-primary" routerLink="/claimant/submit-claim">Submit a claim</a>
    <a class="btn btn-outline-primary" routerLink="/claimant/my-claims">My claims</a>
  </div>

  <section class="panel">
    <h2>Recent notifications</h2>
    <app-loading [active]="loading"></app-loading>
    <app-error-message [message]="errorMessage"></app-error-message>
    <ul *ngIf="notifications.length > 0">
      <li *ngFor="let notification of notifications">
        <strong>{{ notification.title }}</strong>
        <span>{{ notification.message }}</span>
        <small>{{ notification.createdAtUtc | date:'medium' }}</small>
      </li>
    </ul>
    <p *ngIf="!loading && !errorMessage && notifications.length === 0" class="empty">
      There are no recent notifications.
    </p>
  </section>
</section>

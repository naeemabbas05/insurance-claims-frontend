<div class="form-grid">
  <div class="form-field" *ngFor="let item of meta">
    <label [for]="item.mappingColumn">
      {{ item.label }}
      <span *ngIf="item.required" aria-hidden="true">*</span>
    </label>

    <input
      *ngIf="isInputType(item.inputType)"
      class="form-control"
      [id]="item.mappingColumn"
      [type]="item.inputType"
      [required]="!!item.required"
      [placeholder]="item.placeholder || ''"
      [(ngModel)]="mappingModel[item.mappingColumn]">

    <textarea
      *ngIf="item.inputType === 'textarea'"
      class="form-control"
      [id]="item.mappingColumn"
      [required]="!!item.required"
      [placeholder]="item.placeholder || ''"
      rows="4"
      [(ngModel)]="mappingModel[item.mappingColumn]"></textarea>

    <select
      *ngIf="item.inputType === 'select'"
      class="form-select"
      [id]="item.mappingColumn"
      [required]="!!item.required"
      [(ngModel)]="mappingModel[item.mappingColumn]">
      <option value="">Select {{ item.label | lowercase }}</option>
      <option *ngFor="let option of item.data" [ngValue]="option.value">
        {{ option.label }}
      </option>
    </select>

    <select
      *ngIf="item.inputType === 'multi'"
      class="form-select"
      [id]="item.mappingColumn"
      multiple
      [compareWith]="compareOptions"
      [(ngModel)]="mappingModel[item.mappingColumn]">
      <option *ngFor="let option of item.data" [ngValue]="option">{{ option.Name }}</option>
    </select>
  </div>
</div>

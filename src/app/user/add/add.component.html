<section class="page">
  <a class="back-link" routerLink="/">Back to users</a>
  <p class="eyebrow">User administration</p>
  <h1>{{ isEdit ? 'Edit user' : 'Add user' }}</h1>

  <app-loading
    [active]="(!ready && !userLoadFailed) || saving"
    [label]="saving ? 'Saving user' : 'Loading user form'">
  </app-loading>
  <app-error-message [message]="errorMessage"></app-error-message>

  <app-dynamic-form-renderer
    *ngIf="ready"
    [schema]="formSchema"
    [initialValues]="initialValues"
    [previewOnly]="false"
    [submitDisabled]="saving || skillSetLoadFailed"
    (validSubmit)="submit($event)">
  </app-dynamic-form-renderer>
</section>
